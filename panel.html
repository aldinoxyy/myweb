<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LèxaaBot</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family: 'Segoe UI', sans-serif; }
body { background: url('bg.jpg') no-repeat center center fixed; background-size: cover; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
.overlay { position:fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(6px); z-index:-1; }
.card { background: rgba(18,18,18,0.95); border:1px solid #333; border-radius:20px; padding:25px; width:100%; max-width:380px; }
h2 { text-align:center; color:#fff; margin-bottom:15px; letter-spacing:2px; }
input { width:100%; padding:12px; border-radius:10px; border:1px solid #333; background:#111; color:#fff; margin:8px 0; }
.btn { width:100%; padding:13px; border-radius:12px; border:none; margin:8px 0; font-weight:bold; cursor:pointer; }
.btn-white { background:#fff; color:#000; }
.btn-dark { background:linear-gradient(135deg,#111,#222); border:1px solid #333; color:#fff; text-align:left; display:flex; justify-content:space-between; }
.status-box { background:#0f0f0f; border:1px solid #222; border-radius:12px; padding:15px; margin-top:15px; text-align:center; color:#aaa; font-size:13px; }
</style>
</head>
<body>
<div class="overlay"></div>
<div class="card">
<div id="login">
<h2>LÈXAA BOT</h2>
<p style="text-align:center;color:#666;font-size:11px;margin-bottom:15px">PREMIUM ACCESS - NO CLOUDFLARE</p>
<input id="lu" placeholder="Username">
<input id="lp" type="password" placeholder="Password">
<button class="btn btn-white" onclick="login()">LOGIN</button>
</div>
<div id="main" style="display:none">
<h2>LÈXAA BOT</h2>
<p id="welcome" style="text-align:center;color:#0f0;font-size:11px"></p>
<input id="phone" placeholder="Nomor WA 62xxxx">
<button class="btn btn-dark" onclick="req('jaga gb')">BOT JAGA GB <span>›</span></button>
<button class="btn btn-dark" onclick="req('bug wa')">BOT BUG WA <span>›</span></button>
<button class="btn btn-dark" onclick="req('pushkon')">BOT PUSHKON <span>›</span></button>
<button class="btn btn-dark" onclick="req('spotify')">BOT SPOTIFY <span>›</span></button>
<div id="status" class="status-box">System Ready</div>
</div>
</div>
<script>
function getUsers(){ return JSON.parse(localStorage.getItem('lex_users')||'[]'); }
function getReqs(){ return JSON.parse(localStorage.getItem('lex_reqs')||'[]'); }
function saveReqs(r){ localStorage.setItem('lex_reqs', JSON.stringify(r)); }
let myUser=null;
function login(){
 const u=lu.value,p=lp.value;
 const users=getUsers();
 const f=users.find(x=>x.username==u && x.password==p);
 if(!f) return alert('Username / Password Salah');
 if(!f.isUnlimited && new Date(f.expiredAt) < new Date()) return alert('Akun Expired');
 myUser=f;
 document.getElementById('login').style.display='none';
 document.getElementById('main').style.display='block';
 document.getElementById('welcome').innerText='● '+myUser.username.toUpperCase();
 check();
}
function req(service){
 const phone=document.getElementById('phone').value;
 if(!phone) return alert('Isi nomor dulu');
 const reqs=getReqs();
 reqs.push({id:Date.now().toString(),username:myUser.username,service,phone,status:'waiting',time:Date.now()});
 saveReqs(reqs);
 document.getElementById('status').innerHTML='⏳ Wait to connection...<br><small>Auto close 30 menit - Menunggu LèxaaDev</small>';
}
function check(){
 if(!myUser) return;
 const reqs=getReqs();
 const mine=reqs.filter(r=>r.username==myUser.username).pop();
 if(!mine) return;
 const s=document.getElementById('status');
 const diff = Date.now() - mine.time;
 if(diff > 30*60*1000 && mine.status=='waiting'){
   mine.status='failed'; mine.reason='Timeout 30 menit'; saveReqs(reqs);
 }
 if(mine.status=='waiting') s.innerHTML=`⏳ Wait to connection...<br><b>${mine.service}</b> - ${mine.phone}<br><small>Menunggu LèxaaDev</small>`;
 else if(mine.status=='code_sent') s.innerHTML=`KODE:<h1 style="color:#fff;font-size:32px;letter-spacing:5px">${mine.code}</h1>Expired 5 menit<br><small>${mine.service}</small>`;
 else if(mine.status=='connected') s.innerHTML=`✅ Bot ${mine.service} Connect by LèxaaMj`;
 else if(mine.status=='failed') s.innerHTML=`❌ Connection Gagal<br><small>${mine.reason}</small><br><button class="btn btn-white" onclick="location.reload()">Connect Again</button>`;
 else if(mine.status=='expired') s.innerHTML=`❌ Kode Expired<br><button class="btn btn-white" onclick="location.reload()">Connect Again</button>`;
}
setInterval(check,2000);
</script>
</body>
</html>
