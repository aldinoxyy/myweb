<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LèxaaBot</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family: 'Segoe UI', sans-serif; }
body { 
  background: #000;
  background-image: 
    radial-gradient(circle at 20% 30%, rgba(120,0,255,0.15) 0%, transparent 50%),
    radial-gradient(circle at 80% 70%, rgba(255,0,100,0.1) 0%, transparent 50%),
    linear-gradient(180deg, #0a0a0a 0%, #000 100%);
  min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
}
.card { 
  background: rgba(15,15,15,0.9); 
  border:1px solid rgba(255,255,255,0.1); 
  border-radius:24px; 
  padding:28px; 
  width:100%; 
  max-width:360px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.05);
  backdrop-filter: blur(20px);
}
.logo { text-align:center; margin-bottom:20px; }
.logo h2 { color:#fff; letter-spacing:3px; font-size:20px; }
.logo p { color:#666; font-size:10px; letter-spacing:1px; margin-top:5px; }
input { width:100%; padding:13px 15px; border-radius:12px; border:1px solid #222; background:#0a0a0a; color:#fff; margin:7px 0; outline:none; transition:0.2s; }
input:focus { border-color:#444; background:#111; }
.btn { width:100%; padding:13px; border-radius:12px; border:none; margin:8px 0; font-weight:bold; cursor:pointer; transition:0.2s; }
.btn-white { background:#fff; color:#000; box-shadow: 0 5px 15px rgba(255,255,255,0.2); }
.btn-white:active { transform:scale(0.98); }
.btn-dark { background: linear-gradient(135deg, #151515, #0f0f0f); border:1px solid #222; color:#fff; text-align:left; display:flex; justify-content:space-between; align-items:center; padding:16px; }
.btn-dark:hover { border-color:#333; background: linear-gradient(135deg, #1a1a1a, #151515); }
.status-box { background:#0a0a0a; border:1px solid #1a1a1a; border-radius:14px; padding:16px; margin-top:16px; text-align:center; color:#888; font-size:13px; line-height:1.5; }
.dot { width:8px; height:8px; background:#0f0; border-radius:50%; display:inline-block; box-shadow:0 0 10px #0f0; margin-right:6px; }
</style>
</head>
<body>
<div class="card">
<div id="login">
<div class="logo"><h2>LÈXAA BOT</h2><p>PREMIUM ACCESS • NO CLOUDFLARE</p></div>
<input id="lu" placeholder="Username">
<input id="lp" type="password" placeholder="Password">
<button class="btn btn-white" onclick="login()">LOGIN ACCESS</button>
</div>
<div id="main" style="display:none">
<div class="logo"><h2>LÈXAA BOT</h2><p id="welcome" style="color:#0f0">● CONNECTED</p></div>
<input id="phone" placeholder="Nomor WA 62xxxx">
<button class="btn btn-dark" onclick="req('jaga gb')">BOT JAGA GB <span>›</span></button>
<button class="btn btn-dark" onclick="req('bug wa')">BOT BUG WA <span>›</span></button>
<button class="btn btn-dark" onclick="req('pushkon')">BOT PUSHKON <span>›</span></button>
<button class="btn btn-dark" onclick="req('spotify')">BOT SPOTIFY <span>›</span></button>
<div id="status" class="status-box"><span class="dot"></span>System Ready - 1 Tab Mode</div>
</div>
</div>
<script>
function getUsers(){ return JSON.parse(localStorage.getItem('lex_users')||'[]'); }
function getReqs(){ return JSON.parse(localStorage.getItem('lex_reqs')||'[]'); }
function saveReqs(r){ localStorage.setItem('lex_reqs', JSON.stringify(r)); }
let myUser=null;
function login(){
 const u=lu.value,p=lp.value;
 const users=getUsers();
 const f=users.find(x=>x.username==u && x.password==p);
 if(!f) return alert('Username / Password Salah');
 if(!f.isUnlimited && new Date(f.expiredAt) < new Date()) return alert('Akun Expired');
 myUser=f;
 document.getElementById('login').style.display='none';
 document.getElementById('main').style.display='block';
 document.getElementById('welcome').innerText='● '+myUser.username.toUpperCase();
 check();
}
function req(service){
 const phone=document.getElementById('phone').value;
 if(!phone) return alert('Isi nomor dulu');
 const reqs=getReqs();
 reqs.push({id:Date.now().toString(),username:myUser.username,service,phone,status:'waiting',time:Date.now()});
 saveReqs(reqs);
 document.getElementById('status').innerHTML='⏳ Wait to connection...<br><small>Auto close 30 menit</small>';
}
function check(){
 if(!myUser) return;
 const reqs=getReqs();
 const mine=reqs.filter(r=>r.username==myUser.username).pop();
 if(!mine) return;
 const s=document.getElementById('status');
 const diff = Date.now() - mine.time;
 if(diff > 30*60*1000 && mine.status=='waiting'){ mine.status='failed'; mine.reason='Timeout 30 menit'; saveReqs(reqs); }
 if(mine.status=='waiting') s.innerHTML=`⏳ Wait to connection...<br><b>${mine.service.toUpperCase()}</b> - ${mine.phone}<br><small>Menunggu LèxaaDev</small>`;
 else if(mine.status=='code_sent') s.innerHTML=`KODE LOGIN:<h1 style="color:#fff;font-size:32px;letter-spacing:5px;margin:10px 0">${mine.code}</h1>Expired 5 menit<br><small>${mine.service}</small>`;
 else if(mine.status=='connected') s.innerHTML=`✅ Bot ${mine.service} Connect by LèxaaMj`;
 else if(mine.status=='failed') s.innerHTML=`❌ Gagal<br><small>${mine.reason}</small><br><button class="btn btn-white" onclick="location.reload()">Connect Again</button>`;
 else if(mine.status=='expired') s.innerHTML=`❌ Kode Expired<br><button class="btn btn-white" onclick="location.reload()">Connect Again</button>`;
}
setInterval(check,2000);
</script>
</body>
</html>
