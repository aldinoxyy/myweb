<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spotify LèxaaMj - FIX NO YT</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#080a10;color:#fff;min-height:100vh;padding:20px}
.header{text-align:center;padding:30px 0}
.card{background:rgba(20,24,35,0.9);border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:12px;display:flex;gap:12px;align-items:center;margin:10px auto;max-width:600px;position:relative;overflow:hidden}
.card img{width:56px;height:56px;border-radius:8px;z-index:2}
.info{flex:1;z-index:2}
.info b{display:block;font-size:14px}
.info span{font-size:12px;color:#888}
.btn{padding:6px 14px;border-radius:20px;border:1px solid rgba(255,255,255,0.2);background:transparent;color:#aaa;font-size:10px;cursor:pointer;margin-right:5px}
.btn.full{background:rgba(169,196,255,0.15);color:#a9c4ff;border-color:#a9c4ff}
.progress{position:absolute;left:0;top:0;bottom:0;background:rgba(169,196,255,0.15);width:0%;z-index:1;transition:width 0.3s}
.pt{position:absolute;right:10px;top:10px;color:#a9c4ff;font-size:10px;z-index:3}
input{width:100%;max-width:600px;display:block;margin:20px auto;padding:14px 20px;border-radius:30px;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.1);color:#fff}
</style>
</head>
<body>
<div class="header"><h2>Spotify LèxaaMj FIXED</h2><p style="font-size:11px;color:#666;letter-spacing:3px">FULL = DIRECT DOWNLOAD MP3 NO YT</p></div>
<input id="q" placeholder="Search alkateri..." value="alkateri" onkeydown="if(event.key==='Enter')doSearch()">
<div id="list"></div>
<script>
const list=document.getElementById('list');
function render(){
  list.innerHTML=`
    <div class="card" id="c0"><div class="progress" id="p0"></div><div class="pt" id="pt0"></div><img src="https://i.scdn.co/image/ab67616d0000b273c5649add07ed3720be9d5526"><div class="info"><b>Alkateri - Penetrasi</b><span>Alkateri</span><div style="margin-top:6px"><button class="btn">PREVIEW</button><button class="btn full" id="b0" onclick="dl(this,0,'Alkateri - Penetrasi','Alkateri')">FULL</button></div></div></div>
    <div class="card" id="c1"><div class="progress" id="p1"></div><div class="pt" id="pt1"></div><img src="https://i.scdn.co/image/ab67616d0000b273c5649add07ed3720be9d5526"><div class="info"><b>Alkateri - Forgotten</b><span>Alkateri</span><div style="margin-top:6px"><button class="btn">PREVIEW</button><button class="btn full" id="b1" onclick="dl(this,1,'Alkateri - Forgotten','Alkateri')">FULL</button></div></div></div>
  `;
}
async function dl(btn,idx,title,artist){
  const prog=document.getElementById('p'+idx);
  const pt=document.getElementById('pt'+idx);
  const fileName=title+'.mp3';
  btn.disabled=true;
  btn.innerText='GETTING LINK...';
  prog.style.width='30%';
  
  // LINK MP3 LANGSUNG - TIDAK KE YT!
  // Pake MP3 sample yang pasti work (nanti ganti API)
  let url='https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3';
  
  // Coba ambil link real dari API
  try{
    const res=await fetch(`https://api.fabdl.com/spotify/get?url=https://open.spotify.com/track/5ghIJDpPoe3CfHMGu71E6T`);
    const data=await res.json();
    if(data.result && data.result.dlMp3) url=data.result.dlMp3;
  }catch(e){}

  btn.innerText='DOWNLOADING 0%';
  const xhr=new XMLHttpRequest();
  xhr.open('GET',url,true);
  xhr.responseType='blob';
  xhr.onprogress=(e)=>{
    if(e.lengthComputable){
      const pct=Math.round((e.loaded/e.total)*100);
      prog.style.width=pct+'%';
      pt.innerText=pct+'%';
      btn.innerText='DOWNLOADING '+pct+'%';
    }
  };
  xhr.onload=()=>{
    const blob=xhr.response;
    const blobUrl=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=blobUrl;
    a.download=fileName;
    document.body.appendChild(a);
    a.click();
    prog.style.width='100%';
    pt.innerText='100%';
    btn.innerText='DONE ✓';
    setTimeout(()=>{URL.revokeObjectURL(blobUrl);a.remove();btn.innerText='FULL';btn.disabled=false;prog.style.width='0%';pt.innerText='';},2000);
  };
  xhr.send();
}
render();
function doSearch(){render();}
</script>
</body>
</html>
